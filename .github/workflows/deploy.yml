name: Deploy Next.js to VPS

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Устанавливаем зависимости и собираем проект
      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      # 3. Список файлов для проверки
      - name: List build files
        run: ls -la .next public package.json package-lock.json

      # 4. Копируем готовый билд на VPS
      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: ".next package.json package-lock.json public"
          target: "/apps/n-kolmykov/apps/current"

      # 5. Запускаем контейнер на VPS
      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /apps/n-kolmykov
            mkdir -p apps/current host
            # остановка старого контейнера
            docker stop n-kolmykov-frontend || true
            docker rm n-kolmykov-frontend || true
            # собираем Docker image прямо на VPS
            docker build -t nextjs-app:latest apps/current
            # запускаем контейнер с готовым билдом и конфигом хоста
            docker run -d \
              --name n-kolmykov-frontend \
              -v /apps/n-kolmykov/apps/current:/app \
              -v /apps/n-kolmykov/host:/app/host:ro \
              -p 3000:3000 \
              nextjs-app:latest
            echo "✅ Deployment completed at $(date)" >> /var/log/github-ci.log