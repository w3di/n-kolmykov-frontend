name: Deploy Next.js to VPS (prebuilt)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: ".next package.json package-lock.json public node_modules"
          target: "/apps/n-kolmykov/apps/current"

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /apps/n-kolmykov
            mkdir -p apps/current host
            # остановка старого контейнера
            docker stop n-kolmykov-frontend || true
            docker rm n-kolmykov-frontend || true
            # запуск нового контейнера с готовым билдом
            docker run -d \
              --name n-kolmykov-frontend \
              -v /apps/n-kolmykov/apps/current:/app \
              -v /apps/n-kolmykov/host:/app/host:ro \
              -p 3000:3000 \
              node:20 \
              sh -c "cd /app && npm install --production && npm run start"