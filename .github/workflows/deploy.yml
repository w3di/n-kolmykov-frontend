name: Deploy Next.js to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Берём из GitHub Actions Variables/Secrets
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build Next.js
        run: npm run build

      # Собираем Docker-образ из репозитория (multi-stage Dockerfile уже есть)
      - name: Build Docker image
        run: |
          docker build --pull \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            -t nkolmykov/frontend:${{ github.sha }} \
            .

      # Упаковываем образ в tar.gz
      - name: Save image to tar.gz
        run: docker save nkolmykov/frontend:${{ github.sha }} | gzip > image_${{ github.sha }}.tar.gz

      # Копируем tar.gz на VPS
      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          source: "image_${{ github.sha }}.tar.gz"
          target: "~/apps/n-kolmykov/releases"

      # Загружаем образ и перезапускаем контейнер
      - name: Load and run on VPS
        uses: appleboy/ssh-action@v0.1.6
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          envs: NEXT_PUBLIC_SITE_URL
          script: |
            set -euo pipefail
            
            # Функция для логирования
            log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"
            }
            
            # Проверяем место на диске перед началом
            log "Checking disk space before deployment..."
            df -h
            log "Docker disk usage:"
            docker system df
            
            cd ~/apps/n-kolmykov/releases
            
            # Очищаем Docker ресурсы перед загрузкой нового образа
            log "Cleaning up Docker resources..."
            docker system prune -f --volumes
            docker image prune -f
            
            # Останавливаем и удаляем старый контейнер
            log "Stopping and removing old container..."
            docker stop n-kolmykov-frontend || true
            docker rm n-kolmykov-frontend || true
            
            # Загружаем новый образ
            log "Loading new Docker image..."
            gunzip -c image_${{ github.sha }}.tar.gz | docker load
            
            # Проверяем место после загрузки
            log "Disk usage after image load:"
            df -h
            docker system df
            
            # Запускаем новый контейнер
            log "Starting new container..."
            docker run -d --name n-kolmykov-frontend \
              -p 127.0.0.1:3000:3000 \
              -e NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              --restart unless-stopped \
              nkolmykov/frontend:${{ github.sha }}
            
            # Проверяем статус контейнера
            log "Container status:"
            docker ps --filter name=n-kolmykov-frontend
            
            # Очищаем старые образы (оставить только последние 2)
            log "Cleaning up old Docker images (keeping last 2)..."
            docker images nkolmykov/frontend --format "table {{.ID}}\t{{.CreatedAt}}" | tail -n +3 | awk '{print $1}' | xargs -r docker rmi || true
            
            # Очищаем старые tar.gz файлы (оставить последние 3)
            log "Cleaning up old tar.gz files (keeping last 3)..."
            ls -t image_*.tar.gz | tail -n +4 | xargs -r rm -- || true
            
            # Финальная очистка Docker
            log "Final Docker cleanup..."
            docker system prune -f --volumes
            
            # Финальная проверка места
            log "Final disk usage:"
            df -h
            docker system df
            
            log "Deployment completed successfully!"