name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Create deploy archive
        run: tar -czf build.tar.gz .next public package.json package-lock.json

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          source: "build.tar.gz"
          target: "~/deploy/"

      - name: Extract and run container on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            cd ~/deploy
            tar -xzf build.tar.gz
            docker stop n-kolmykov-frontend || true
            docker rm n-kolmykov-frontend || true
            docker build -t nextjs-app .
            docker run -d --name n-kolmykov-frontend -p 3000:3000 nextjs-app