name: Deploy Next.js to VPS

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t nextjs-app:latest .

      - name: Save Docker image to tar
        run: |
          docker save nextjs-app:latest | gzip > image.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "image.tar.gz"
          target: "/apps/n-kolmykov/"

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd /apps/n-kolmykov
            mkdir -p apps/current
            gunzip -f image.tar.gz
            docker load < image.tar
            # остановка и удаление старого контейнера
            docker stop n-kolmykov-frontend || true
            docker rm n-kolmykov-frontend || true
            # запуск нового контейнера
            docker run -d \
              --name n-kolmykov-frontend \
              -v /apps/n-kolmykov/apps/current:/app \
              -v /apps/n-kolmykov/host:/app/host:ro \
              -p 3000:3000 \
              nextjs-app:latest
            echo "✅ Deployment completed at $(date)" >> /var/log/github-ci.log